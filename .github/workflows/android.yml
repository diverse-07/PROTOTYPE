name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Web Assets
      working-directory: ./frontend
      run: npm run build

    - name: Sync Capacitor
      working-directory: ./frontend
      run: npx cap sync android

    - name: Build APK
      working-directory: ./frontend/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AEGIS_LEWS_v2.0_PROTOTYPE.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AEGIS_LEWS_v2.0_PROTOTYPE
        path: frontend/android/app/build/outputs/apk/debug/AEGIS_LEWS_v2.0_PROTOTYPE.apk

    - name: Create or Update GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0-prototype
        name: "AEGIS LEWS v2.0.0 Production Prototype Release"
        files: frontend/android/app/build/outputs/apk/debug/AEGIS_LEWS_v2.0_PROTOTYPE.apk
        body: |
          ### AEGIS NER-LEWS v2.0 Production Android APK
          - **Offline Bluetooth P2P Mesh:** Operates 100% autonomously with 0 KB internet, no SIM card, and no Wi-Fi.
          - **Web-to-Offline BLE Broadcast Bridge:** Web dashboard triggers broadcast on primary gateway phone, which beams to nearby offline citizen devices.
          - **Emergency Audio-Visual Siren:** Low-latency air-gapped distress beacon detection with automatic takeover siren and bedrock shelter guidance.
